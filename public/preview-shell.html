<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style id="framework-css"></style>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
      }
      #mount {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script src="/vendor/axe-core.min.js"></script>
  </head>
  <body>
    <main id="mount"></main>
    <script>
      var mount = document.getElementById("mount");
      var frameworkCss = document.getElementById("framework-css");

      window.addEventListener("message", function (e) {
        if (e.data && e.data.type === "preview:render") {
          frameworkCss.textContent = e.data.css || "";
          mount.innerHTML = e.data.html;

          document.fonts.ready.then(function () {
            axe
              .run(mount, {
                runOnly: {
                  type: "tag",
                  values: [
                    "wcag2a",
                    "wcag2aa",
                    "wcag21a",
                    "wcag21aa",
                    "wcag22aa",
                    "best-practice",
                  ],
                },
              })
              .then(function (result) {
                parent.postMessage(
                  {
                    type: "axe:result",
                    violations: result.violations,
                    passes: result.passes,
                    incomplete: result.incomplete,
                  },
                  window.location.origin,
                );
              })
              .catch(function (err) {
                parent.postMessage(
                  {
                    type: "axe:error",
                    message: err.message,
                  },
                  window.location.origin,
                );
              });
          });
        }
      });

      parent.postMessage({ type: "preview:ready" }, window.location.origin);
    </script>
  </body>
</html>
