<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style id="framework-css"></style>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
      }
      #mount {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script src="/vendor/axe-core.min.js"></script>
  </head>
  <body>
    <main id="mount"></main>
    <script>
      var mount = document.getElementById("mount");
      var frameworkCss = document.getElementById("framework-css");

      window.addEventListener("message", function (e) {
        if (e.data && e.data.type === "preview:render") {
          if (
            typeof e.data.rootFontSize === "number" &&
            e.data.rootFontSize > 0
          ) {
            document.documentElement.style.fontSize =
              e.data.rootFontSize + "px";
          }
          frameworkCss.textContent = e.data.css || "";
          mount.innerHTML = e.data.html;

          document.fonts.ready.then(function () {
            // Measure overflow on the rendered element. Done after fonts
            // are ready so text metrics are stable; layout is then final.
            // Posted as its own message so dom-rule consumers can react
            // independently of axe (and so axe failures don't block this).
            var target = mount.firstElementChild;
            if (target) {
              parent.postMessage(
                {
                  type: "overflow:result",
                  measurement: {
                    tagName: target.tagName.toLowerCase(),
                    scrollWidth: target.scrollWidth,
                    clientWidth: target.clientWidth,
                    scrollHeight: target.scrollHeight,
                    clientHeight: target.clientHeight,
                  },
                },
                window.location.origin,
              );
            }

            axe
              .run(mount, {
                runOnly: {
                  type: "tag",
                  values: [
                    "wcag2a",
                    "wcag2aa",
                    "wcag21a",
                    "wcag21aa",
                    "wcag22aa",
                    "best-practice",
                  ],
                },
              })
              .then(function (result) {
                parent.postMessage(
                  {
                    type: "axe:result",
                    violations: result.violations,
                    passes: result.passes,
                    incomplete: result.incomplete,
                  },
                  window.location.origin,
                );
              })
              .catch(function (err) {
                parent.postMessage(
                  {
                    type: "axe:error",
                    message: err.message,
                  },
                  window.location.origin,
                );
              });
          });
        }
      });

      // Outside-click bridge: clicks inside an iframe never reach the
      // parent document, which breaks @vueuse onClickOutside for any
      // dropdown / popover in the studio. We forward pointerdown events
      // as a message so the parent can dismiss those overlays. Capture
      // phase so we fire before any rendered content can stop the event.
      document.addEventListener(
        "pointerdown",
        function () {
          parent.postMessage(
            { type: "preview:pointerdown" },
            window.location.origin,
          );
        },
        true,
      );

      // Demo-click bridge: report when the user interacts with any
      // trigger-shaped element in the rendered preview. The parent uses
      // this to fire the "demo action triggered" toast. Delegated here
      // so render functions can emit plain semantic markup without an
      // inline onclick attribute leaking AccessLab plumbing.
      var TRIGGER_SELECTOR =
        'button, input[type="submit"], input[type="button"], input[type="reset"]';

      mount.addEventListener("click", function (event) {
        if (event.target.closest(TRIGGER_SELECTOR)) {
          parent.postMessage(
            { type: "demo:click" },
            window.location.origin,
          );
        }
      });

      // Cancel form submissions inside the preview. Render functions
      // can emit a bare <form> element; the shell stops the navigation
      // so a submit-typed button click does not blank the iframe.
      mount.addEventListener("submit", function (event) {
        event.preventDefault();
      });

      parent.postMessage({ type: "preview:ready" }, window.location.origin);
    </script>
  </body>
</html>
