<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style id="framework-css"></style>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
      }
      #mount {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
    <script src="/vendor/axe-core.min.js"></script>
  </head>
  <body>
    <main id="mount"></main>
    <script>
      var mount = document.getElementById("mount");
      var frameworkCss = document.getElementById("framework-css");

      // Pre-defined for inspected components whose rendered HTML
      // includes inline event handlers referencing the canonical
      // production-style JS shown in the code drawer's JS tab. The
      // HTML pane shows production-style code (e.g. the switches
      // dark-mode demo's `onclick="toggleDarkMode()"`); this binding
      // lets that handler actually fire inside the iframe. The body
      // class is paired with a `body.dark-mode { ... }` rule in the
      // rendered CSS. See `inspected/buttons/switches/definition.ts`.
      window.toggleDarkMode = function () {
        document.body.classList.toggle("dark-mode");
      };

      // Pre-defined for the toggle-button demo's
      // `onclick="toggleBold()"`. Wraps / unwraps the sample
      // paragraph in `<strong>` so the click actually does
      // something visible - mirrors the simple production-style JS
      // shown in the code drawer's JS tab. The host also re-renders
      // (driven by togglePressed) so any state-restoration after
      // navigation produces the same markup; see
      // `inspected/buttons/toggle-buttons/definition.ts`.
      window.toggleBold = function () {
        var text = document.querySelector("p");
        if (!text) return;
        var isBold = text.querySelector("strong") !== null;
        text.innerHTML = isBold ? text.textContent : "<strong>" + text.textContent + "</strong>";
      };

      // Pre-defined for the input show-password toggle's
      // `onclick="togglePasswordVisibility(this)"`. Flips the controlled
      // password field between masked and visible, keeps the button's
      // aria-pressed state in sync, and swaps its visible label - the same
      // production-style handler shown in the code drawer's JS tab. See
      // `inspected/input/render.ts`.
      window.togglePasswordVisibility = function (button) {
        var input = document.getElementById(button.getAttribute("aria-controls"));
        if (!input) return;
        var showing = input.type === "text";
        input.type = showing ? "password" : "text";
        button.setAttribute("aria-pressed", String(!showing));
        button.textContent = showing ? "Show password" : "Hide password";
      };

      // Pre-defined for the div-combobox trigger's inline
      // onkeydown="handleComboboxKeydown(event, this)". A custom
      // `<div role="combobox">` gets none of the keyboard behaviour a native
      // <select> provides, so a developer has to add it by hand. This handles
      // ONLY Enter and Space, which re-use the click path (so the HOST stays
      // the owner of the open/closed state). Arrow navigation, type-ahead,
      // Escape, and focus management are deliberately absent - that
      // incompleteness IS the select-not-keyboard lesson, shown verbatim in
      // the code drawer's JS tab. See inspected/select/render.ts.
      window.handleComboboxKeydown = function (event, trigger) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          trigger.click();
        }
      };

      window.addEventListener("message", function (e) {
        if (e.data && e.data.type === "preview:render") {
          if (typeof e.data.rootFontSize === "number" && e.data.rootFontSize > 0) {
            document.documentElement.style.fontSize = e.data.rootFontSize + "px";
          }
          frameworkCss.textContent = e.data.css || "";
          mount.innerHTML = e.data.html;

          // `indeterminate` is a DOM property, not an HTML attribute -
          // it can only be set from JavaScript. Renderers emit the
          // `data-al-indeterminate` marker on any checkbox that should
          // display as indeterminate; we apply the property here so
          // the rendered preview matches what production code would do.
          var indeterminateBoxes = mount.querySelectorAll(
            'input[type="checkbox"][data-al-indeterminate]',
          );
          for (var i = 0; i < indeterminateBoxes.length; i++) {
            indeterminateBoxes[i].indeterminate = true;
          }

          document.fonts.ready.then(function () {
            // Measure overflow on the rendered element. Done after fonts
            // are ready so text metrics are stable; layout is then final.
            // Posted as its own message so dom-rule consumers can react
            // independently of axe (and so axe failures don't block this).
            var target = mount.firstElementChild;
            if (target) {
              // Overflow grades the outer rendered element; target-size grades
              // the interactive control's border-box (the button/input itself,
              // which may sit inside a form/anchor/wrapper). Fall back to the
              // outer element when there is no control (non-button components).
              var control = mount.querySelector("button, input") || target;
              parent.postMessage(
                {
                  type: "dom:measurement",
                  measurement: {
                    tagName: target.tagName.toLowerCase(),
                    scrollWidth: target.scrollWidth,
                    clientWidth: target.clientWidth,
                    scrollHeight: target.scrollHeight,
                    clientHeight: target.clientHeight,
                    targetWidth: control.offsetWidth,
                    targetHeight: control.offsetHeight,
                  },
                },
                window.location.origin,
              );
            }

            axe
              .run(mount, {
                runOnly: {
                  type: "tag",
                  values: [
                    "wcag2a",
                    "wcag2aa",
                    "wcag2aaa",
                    "wcag21a",
                    "wcag21aa",
                    "wcag22aa",
                    "best-practice",
                    "experimental",
                  ],
                },
              })
              .then(function (result) {
                parent.postMessage(
                  {
                    type: "axe:result",
                    violations: result.violations,
                    passes: result.passes,
                    incomplete: result.incomplete,
                  },
                  window.location.origin,
                );
              })
              .catch(function (err) {
                parent.postMessage(
                  {
                    type: "axe:error",
                    message: err.message,
                  },
                  window.location.origin,
                );
              });
          });
        }
      });

      // Outside-click bridge: clicks inside an iframe never reach the
      // parent document, which breaks @vueuse onClickOutside for any
      // dropdown / popover in the studio. We forward pointerdown events
      // as a message so the parent can dismiss those overlays. Capture
      // phase so we fire before any rendered content can stop the event.
      document.addEventListener(
        "pointerdown",
        function () {
          parent.postMessage({ type: "preview:pointerdown" }, window.location.origin);
        },
        true,
      );

      // Interaction bridge: the click handlers below report what the user did
      // in the rendered preview as plain facts (demo:activate / demo:pick /
      // demo:click, plus the submit/reset heuristic); the host's controls
      // decide what each fact means. TRIGGER_SELECTOR is the set of native
      // trigger-shaped elements.
      var TRIGGER_SELECTOR =
        'button, input[type="submit"], input[type="button"], input[type="reset"], input[type="image"]';

      // Generic activation proxy: a click anywhere inside an element marked
      // `data-al-activates` is forwarded to the inspected control within it, so a
      // visible label (or its layout wrapper) can act as the activation target -
      // the production pattern for controls a native `<label for>` can't bind to,
      // e.g. a switch button. The marker sits on the studio wrapper, not the
      // control, so the copied markup stays clean.
      mount.addEventListener("click", function (event) {
        if (!(event.target instanceof Element)) return;
        var region = event.target.closest("[data-al-activates]");
        if (!region) return;
        var control = region.querySelector(".al-inspected-element");
        if (control instanceof HTMLElement && !control.contains(event.target)) {
          control.click();
        }
      });

      // Declarative, host-interpreted activation. A click on an "activator"
      // inside an element marked data-al-interaction reports a plain "the
      // trigger was activated" fact (demo:activate); the host's controls decide
      // what it means (a disclosure flips its panel; the combobox toggles its
      // popup). Activators are native triggers (button / input) AND ARIA widget
      // triggers (role="combobox") - the latter lets a non-button custom widget
      // join the protocol with no bespoke shell branch. Options and panel
      // content are not activators, so a click inside an open popup never
      // re-fires the toggle.
      var ACTIVATOR_SELECTOR = TRIGGER_SELECTOR + ', [role="combobox"]';
      mount.addEventListener("click", function (event) {
        if (!(event.target instanceof Element)) return;
        var activator = event.target.closest(ACTIVATOR_SELECTOR);
        if (!activator) return;
        var interactionRoot = activator.closest("[data-al-interaction]");
        if (!interactionRoot) return;
        parent.postMessage(
          {
            type: "demo:activate",
            interaction: interactionRoot.getAttribute("data-al-interaction"),
          },
          window.location.origin,
        );
      });

      // Generic option-commit fact: a click on an element marked data-al-pick
      // reports the committed value; the host's controls decide what it means
      // (the select adopts the chosen option and closes its popup). Generic so
      // any "pick from a list" widget reuses it without a bespoke shell branch.
      mount.addEventListener("click", function (event) {
        if (!(event.target instanceof Element)) return;
        var picker = event.target.closest("[data-al-pick]");
        if (!picker) return;
        parent.postMessage(
          { type: "demo:pick", value: picker.getAttribute("data-al-pick") || "" },
          window.location.origin,
        );
      });

      // Submit / reset heuristic + generic click, run independently of the
      // activation fact above: a type-less disclosure <button> both activates
      // (above) AND surfaces the same "no form to submit to" lesson here -
      // independent facts, both worth teaching.
      mount.addEventListener("click", function (event) {
        if (!(event.target instanceof Element)) return;
        var trigger = event.target.closest(TRIGGER_SELECTOR);
        if (!trigger) return;

        // Triggers inside a data-al-interaction region already reported
        // demo:activate, so the generic demo:click below is suppressed for them.
        var inInteraction = !!trigger.closest("[data-al-interaction]");
        var form = trigger.closest("form");
        var triggerType = trigger.type || "submit";
        // <input type="image"> is a submit button per HTML spec.
        var isSubmit = triggerType === "submit" || triggerType === "image";
        var isReset = triggerType === "reset";

        // Submit / reset inside a form: the form event handlers below
        // will fire and post their own payload-aware message. Suppress
        // the generic click so the user does not see two.
        if (form && (isSubmit || isReset)) return;

        // Submit / reset outside a form: the click does nothing - there
        // is no form to act on. Surface the misuse via an error toast so
        // the user understands why nothing visible happened.
        if (!form && isSubmit) {
          parent.postMessage({ type: "form:submitMissingForm" }, window.location.origin);
          return;
        }
        if (!form && isReset) {
          parent.postMessage({ type: "form:resetMissingForm" }, window.location.origin);
          return;
        }

        // Generic activation for un-migrated components.
        if (!inInteraction) {
          parent.postMessage({ type: "demo:click" }, window.location.origin);
        }
      });

      // Native form-control changes route back to the host so the
      // model stays in sync with what the user just did in the iframe.
      //
      //   <input type="checkbox"|"radio"> with data-al-child-index
      //     → demo:click-child {index} (a child of a checkbox group,
      //       radio group, or checkbox parent-with-children layout)
      //   <input type="checkbox"> with al-inspected-element
      //     → demo:click (the single inspected checkbox/switch)
      //   <select> with al-inspected-element
      //     → select:change {value, label, values}
      mount.addEventListener("change", function (event) {
        var el = event.target;
        if (!(el instanceof Element)) return;

        // <select> - post the picked value + label so the host can
        // resolve back to the original option in its model.
        if (el.tagName === "SELECT" && el.classList.contains("al-inspected-element")) {
          var selectEl = /** @type {HTMLSelectElement} */ (el);
          var picked = selectEl.selectedOptions[0];
          parent.postMessage(
            {
              type: "select:change",
              value: selectEl.value,
              label: picked ? (picked.textContent || "").trim() : "",
              values: Array.prototype.map.call(selectEl.selectedOptions, function (o) {
                return o.value;
              }),
              labels: Array.prototype.map.call(selectEl.selectedOptions, function (o) {
                return (o.textContent || "").trim();
              }),
            },
            window.location.origin,
          );
          return;
        }

        if (!(el instanceof HTMLInputElement)) return;
        if (el.type !== "checkbox" && el.type !== "radio") return;

        var childIndex = el.getAttribute("data-al-child-index");
        if (childIndex !== null) {
          parent.postMessage(
            { type: "demo:click-child", index: Number(childIndex) },
            window.location.origin,
          );
          return;
        }
        if (el.classList.contains("al-inspected-element")) {
          parent.postMessage({ type: "demo:click" }, window.location.origin);
        }
      });

      // Custom div checkbox (`<div role="checkbox">`) has no native
      // click-as-change semantics, so we forward clicks directly. The
      // host's pattern listener flips `checked`; the re-render then
      // shows the updated `aria-checked` state. Children of a parent-
      // with-children group post `demo:click-child` with their index
      // instead, matching the native-checkbox branch above.
      mount.addEventListener("click", function (event) {
        if (!(event.target instanceof Element)) return;
        var el = event.target.closest("[role='checkbox']");
        if (!el) return;
        var childIndex = el.getAttribute("data-al-child-index");
        if (childIndex !== null) {
          parent.postMessage(
            { type: "demo:click-child", index: Number(childIndex) },
            window.location.origin,
          );
          return;
        }
        if (el.classList.contains("al-inspected-element")) {
          parent.postMessage({ type: "demo:click" }, window.location.origin);
        }
      });

      // Cancel form submissions inside the preview so the iframe does
      // not navigate away. Report the full set of submitted name/value
      // pairs by reading FormData against the form + submitter (the
      // browser's own submission-data algorithm). Also report whether
      // the trigger was a <button> with no `type` attribute - that's
      // the implicit-submit pitfall and the only case where the
      // "Why did the button send a form submission?" link is relevant.
      mount.addEventListener("submit", function (event) {
        event.preventDefault();
        var form = event.target;
        var submitter = event.submitter || null;
        var entries = [];
        if (form instanceof HTMLFormElement) {
          var fd = new FormData(form, submitter);
          fd.forEach(function (value, name) {
            entries.push({ name: name, value: String(value) });
          });
        }
        var wasImplicitSubmit = !!(
          submitter &&
          submitter.tagName === "BUTTON" &&
          !submitter.hasAttribute("type")
        );
        var wasImageSubmit = !!(
          submitter &&
          submitter.tagName === "INPUT" &&
          submitter.type === "image"
        );
        parent.postMessage(
          {
            type: "form:submitted",
            entries: entries,
            wasImplicitSubmit: wasImplicitSubmit,
            wasImageSubmit: wasImageSubmit,
          },
          window.location.origin,
        );
      });

      // Reset events do not navigate, so we let the browser do its work
      // (clearing form inputs) and just notify the parent for the toast.
      mount.addEventListener("reset", function () {
        parent.postMessage({ type: "form:reset" }, window.location.origin);
      });

      parent.postMessage({ type: "preview:ready" }, window.location.origin);
    </script>
  </body>
</html>
